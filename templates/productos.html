{% extends "layout.html" %}
{% block content %}
<div class="container-fluid">
    <h1>Productos</h1>
    <p>{{mensaje}}</p>
    <p>Aquí puedes encontrar información sobre los productos que ofrecemos.</p>
</div>
<div id="carouselExampleControls" class="carousel slide mi-carrusel" data-ride="carousel">

    <div class="carousel-inner">

        <div class="carousel-item active">
            <img src="{{ url_for('static', filename='img/productos/peluche_gato.png') }}" class="d-block w-100"
                 alt="Peluche de Gato">
        </div>

        <div class="carousel-item">
            <img src="{{ url_for('static', filename='img/productos/peluche_perrito.png') }}" class="d-block w-100"
                alt="Peluche de Perro">
        </div>

        <div class="carousel-item">
            <img src="{{ url_for('static', filename='img/productos/peluche_pandemuerto.png') }}" class="d-block w-100"
                alt="Peluche de Pan de muerto">
        </div>

    </div>

    <a class="carousel-control-prev" href="#carouselExampleControls" role="button" data-slide="prev">

        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    </a>

    <a class="carousel-control-next" href="#carouselExampleControls" role="button" data-slide="next">

        <span class="carousel-control-next-icon" aria-hidden="true"></span>
    </a>

</div>
</div>
{% endblock %}
